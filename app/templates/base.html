<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Testing Assistant{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #ddd; margin-bottom: 1.5rem; }
    header nav a { margin-right: 1rem; }
    .muted { color: #777; font-size: 0.9rem; }
    input[type=url], input[type=text] { width: 70%; padding: 0.5rem; }
    button { padding: 0.5rem 1rem; cursor: pointer; }
    .error { background: #fdecea; border: 1px solid #f5c2c0; color: #8a1c14; padding: 0.75rem 1rem; border-radius: 6px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #eee; vertical-align: top; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <div>
      <h1>Testing Assistant</h1>
      <nav><a href="/">Scan</a><a href="/history">History</a></nav>
    </div>
    <span class="muted">Model: {{ model }}</span>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
